<p-toast></p-toast>
<p-confirmDialog [style]="{width: '50vw'}"></p-confirmDialog>

<div class="card">
  <p-table [value]="produtos" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="caption">
      <div class="flex align-items-center justify-content-between">
        Produtos
        <p-button icon="pi pi-plus" label="Novo Produto" routerLink="/products/new"></p-button>
      </div>
    </ng-template>
    <ng-template pTemplate="header">
      <tr>
        <th>Nome</th>
        <th>Preço</th>
        <th>Descrição</th>
        <th>Quantidade em Estoque</th>
        <th>Ações</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-produto>
      <tr>
        <td>{{ produto.nome }}</td>
        <td>{{ produto.preco | currency: 'BRL' }}</td>
        <td>{{ produto.descricao }}</td>
        <td>{{ produto.quantidadeEmEstoque }}</td>
        <td>
          <p-button icon="pi pi-pencil" styleClass="p-button-rounded p-button-success mr-2" [routerLink]="['/products/edit', produto.id]"></p-button>
          <p-button icon="pi pi-trash" styleClass="p-button-rounded p-button-warning" (click)="deleteProduto(produto.id)"></p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
